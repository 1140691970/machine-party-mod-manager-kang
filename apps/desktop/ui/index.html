<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="images/logo.svg" />
    <title>Machine Party 模组管理器</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="components.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand" aria-label="Machine Party 模组管理器">
          <img src="images/logo.svg" alt="" />
          <div><b>MACHINE PARTY</b><small>模组管理器</small></div>
        </div>
        <div class="topbar-tools">
          <label id="search" class="field search" data-icon="search">
            <input type="search" placeholder="搜索模组名称" aria-label="搜索模组" />
          </label>
          <button id="refresh-catalog" class="btn btn-ghost btn-icon topbar-btn" type="button" data-icon="refresh"></button>
          <button id="open-settings" class="btn btn-ghost btn-icon topbar-btn" type="button" data-icon="settings"></button>
        </div>
      </div>
    </header>
    <main>
      <div id="content"></div>
    </main>
    <dialog class="dialog" aria-labelledby="dialogTitle">
      <div class="dialog-head">
        <h2 id="dialogTitle"></h2>
        <button id="close" class="btn btn-ghost btn-icon" aria-label="关闭" data-icon="close"></button>
      </div>
      <div id="dialogBody" class="dialog-body"></div>
    </dialog>
    <dialog id="settings-dialog" class="dialog settings-dialog" aria-labelledby="settingsTitle">
      <div class="dialog-head">
        <h2 id="settingsTitle"></h2>
        <button id="close-settings" class="btn btn-ghost btn-icon" type="button" aria-label="关闭" data-icon="close"></button>
      </div>
      <div id="settingsBody" class="settings-body"></div>
    </dialog>
  </body>
</html>
