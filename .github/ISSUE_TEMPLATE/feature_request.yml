name: Feature request · 功能建议
description: Suggest an improvement to the manager. To recommend a mod, use the mod submission form. · 建议改进管理器。推荐模组请使用模组投稿表单。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem · 要解决的问题
      description: What are you trying to do, and what gets in the way? · 你想做什么，遇到了什么阻碍？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour · 建议的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered · 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: Scope · 范围
      options:
        - label: This does not require filters, rankings or GitHub-wide search, which are out of scope. · 不需要筛选、排行榜或 GitHub 全站搜索（这些不在产品范围内）。
