name: Release desktop app
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Test an already staged update without publishing
        type: boolean
        default: false
      publish_preview:
        description: Publish a Windows GitHub prerelease after acceptance
        type: boolean
        default: false
      build_run:
        description: Optional previous desktop build run ID to retry the same installers
        required: false
        type: string
env:
  UNSIGNED_WINDOWS: ${{ vars.WINDOWS_SIGNING_PROVIDER == '' && vars.WINDOWS_SIGNING_THUMBPRINT == '' && vars.WINDOWS_SIGNING_SUBJECT == '' }}
  WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
  WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
  WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
permissions:
  contents: read
concurrency:
  group: desktop-stable-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.build_run == ''
    runs-on: ${{ vars.WINDOWS_SIGNING_RUNNER || 'windows-2022' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Configure Authenticode
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        env:
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:UNSIGNED_WINDOWS -eq 'true') { Write-Host 'Building Windows installer without Authenticode'; exit 0 }
          $config = Get-Content tauri.windows.conf.json -Raw | ConvertFrom-Json -AsHashtable
          if ($env:WINDOWS_SIGNING_PROVIDER -eq 'azure') {
            if (!$env:WINDOWS_SIGNING_SUBJECT -or $env:ENDPOINT -notmatch '^https://[a-z0-9-]+\.codesigning\.azure\.net/?$') {
              throw 'Configure Azure Public Trust endpoint and validated publisher subject.'
            }
            cargo install artifact-signing-cli --version 0.12.0 --locked
            $config.bundle.windows.signCommand = @{ cmd='artifact-signing-cli'; args=@('-e', $env:ENDPOINT, '%1') }
          } elseif (!$env:WINDOWS_SIGNING_PROVIDER -or $env:WINDOWS_SIGNING_PROVIDER -eq 'store') {
            if ($env:WINDOWS_SIGNING_THUMBPRINT -notmatch '^[a-fA-F0-9]{40}$') {
              throw 'No signing identity: configure a Windows signing runner and thumbprint, or configure Azure Public Trust.'
            }
            $config.bundle.windows.certificateThumbprint = $env:WINDOWS_SIGNING_THUMBPRINT
            $config.bundle.windows.digestAlgorithm = 'sha256'
            $config.bundle.windows.timestampUrl = 'http://timestamp.digicert.com'
          } else { throw 'Unknown Windows signing provider.' }
          $config | ConvertTo-Json -Depth 8 | Set-Content tauri.windows.conf.json
      - name: Build Windows installer and older acceptance client
        env:
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version) { throw 'Version mismatch' }
          $dist = Join-Path $env:GITHUB_WORKSPACE dist
          New-Item -ItemType Directory $dist | Out-Null
          npx --yes --package @tauri-apps/cli@2.12.5 tauri build --bundles nsis -- --locked
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName (Join-Path $dist setup.exe)
          foreach ($file in @('target/release/machine-party-mod-manager.exe', "$dist/setup.exe")) {
            & "$env:GITHUB_WORKSPACE/scripts/verify-windows-signature.ps1" -Path $file
          }
          $overlay = @{version='0.0.1'; plugins=@{updater=@{endpoints=@("https://machineparty.ailaogong.men/v1/app-downloads/$version/manifest.json")}}}
          $overlay | ConvertTo-Json -Depth 6 | Set-Content acceptance.json
          Remove-Item target/release/bundle/nsis/*-setup.exe
          npx --yes --package @tauri-apps/cli@2.12.5 tauri build --config acceptance.json --bundles nsis -- --locked
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName (Join-Path $dist bootstrap.exe)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: dist/
          retention-days: 14
  windows-acceptance:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-installers
          path: dist
      - name: Verify clean install, migration and native WebView
        shell: pwsh
        run: ./scripts/test-windows-install.ps1 -Installer (Resolve-Path dist/setup.exe)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui
          path: dist/windows-ui/
          if-no-files-found: warn
  build-mac:
    if: github.ref == 'refs/heads/main' && inputs.build_run == '' && !inputs.publish_preview
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Build Apple Silicon application
        working-directory: apps/desktop/src-tauri
        run: |
          set -eu
          rustup target add aarch64-apple-darwin
          npx --yes --package @tauri-apps/cli@2.12.5 tauri build --target aarch64-apple-darwin --bundles app -- --locked
          cd target/aarch64-apple-darwin/release/bundle/macos
          app=( *.app )
          codesign --verify --deep --strict "${app[0]}"
          archive="$RUNNER_TEMP/MachineParty-aarch64.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" "${app[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: ${{ runner.temp }}/MachineParty-aarch64.app.tar.gz
          retention-days: 14
  verify:
    if: inputs.verify_only && inputs.build_run != ''
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-installers
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
      - run: ./scripts/test-upgrade.ps1
  publish-preview:
    if: inputs.publish_preview && !inputs.verify_only && github.ref == 'refs/heads/main'
    needs: [build, windows-acceptance]
    runs-on: windows-2022
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-installers
          path: dist
      - name: Verify publisher and publish Windows prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/verify-windows-signature.ps1 -Path dist/setup.exe
          $notes = @('--generate-notes')
          if ($env:UNSIGNED_WINDOWS -eq 'true') {
            $notes = @('--notes', 'Windows x64 測試版，安裝檔為 setup.exe。本版未簽署 Authenticode，Windows SmartScreen 可能顯示「發行者未知」。')
          }
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+-\d+$') { throw 'Choose a new Windows prerelease version.' }
          gh release create "v$version" dist/setup.exe --target $env:GITHUB_SHA --prerelease --latest=false --title "v$version" @notes
  release:
    needs: [build, build-mac, windows-acceptance]
    if: always() && !inputs.publish_preview && !inputs.verify_only && !cancelled() && github.ref == 'refs/heads/main' && ((needs.build.result == 'success' && needs.build-mac.result == 'success' && needs.windows-acceptance.result == 'success') || (needs.build.result == 'skipped' && inputs.build_run != ''))
    runs-on: windows-2022
    environment: production
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate installer source
        shell: bash
        env:
          BUILD_RUN: ${{ inputs.build_run || github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq 'select(.path == ".github/workflows/app-release.yml" and .head_branch == "main" and .event == "workflow_dispatch")|.head_sha')
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$sha" HEAD
          git diff --exit-code "$sha" HEAD -- . ':(exclude).github/**' ':(exclude)scripts/**' ':(exclude)tests/**' ':(exclude)docs/**' ':(exclude)*.md' ':(exclude).editorconfig' ':(exclude)package.json'
          echo "BUILD_SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-installers
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run || github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run || github.run_id }}
      - name: Validate stable Windows publisher
        shell: pwsh
        run: |
          ./scripts/verify-windows-signature.ps1 -Path dist/setup.exe
      - name: Sign platform updates
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          version=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')
          npx --yes --package @tauri-apps/cli@2.12.5 tauri signer sign --app-version "$version" -p '' dist/setup.exe
          npx --yes --package @tauri-apps/cli@2.12.5 tauri signer sign --app-version "$version" -p '' dist/MachineParty-aarch64.app.tar.gz
      - name: Stage version in R2
        run: python scripts/app-release.py stage
        env: &storage
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET_NAME }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      - name: Install old client and update through Worker
        run: ./scripts/test-upgrade.ps1
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -1 "$tag")" = "$BUILD_SHA"
          else
            git push origin "$BUILD_SHA:refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/setup.exe dist/setup.exe.sig dist/MachineParty-aarch64.app.tar.gz dist/MachineParty-aarch64.app.tar.gz.sig --verify-tag --title "$tag" --generate-notes
          else
            gh release download "$tag" -p setup.exe -D existing
            gh release download "$tag" -p MachineParty-aarch64.app.tar.gz -D existing
            cmp dist/setup.exe existing/setup.exe
            cmp dist/MachineParty-aarch64.app.tar.gz existing/MachineParty-aarch64.app.tar.gz
          fi
      - name: Promote stable manifest and verify public endpoint
        run: python scripts/app-release.py promote
        env: *storage
