name: Release desktop app
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Test an already staged update without publishing
        type: boolean
        default: false
      build_run:
        description: Optional previous desktop build run ID to retry the same installers
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-stable-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.build_run == ''
    runs-on: ${{ vars.WINDOWS_SIGNING_RUNNER || 'windows-2022' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Configure Authenticode
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        env:
          CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          if (!$env:CERT_THUMBPRINT) {
            if ($env:VERIFY_ONLY -ne 'true') { throw 'Configure Windows code signing before stable publication.' }
            Write-Host 'Unsigned preview build'
            exit 0
          }
          if ($env:CERT_THUMBPRINT -notmatch '^[a-fA-F0-9]{40}$') { throw 'Invalid signing thumbprint' }
          $config = Get-Content tauri.windows.conf.json -Raw | ConvertFrom-Json -AsHashtable
          $config.bundle.windows.certificateThumbprint = $env:CERT_THUMBPRINT
          $config.bundle.windows.digestAlgorithm = 'sha256'
          $config.bundle.windows.timestampUrl = 'http://timestamp.digicert.com'
          $config | ConvertTo-Json -Depth 8 | Set-Content tauri.windows.conf.json
      - name: Build Windows installer and older acceptance client
        env:
          CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version) { throw 'Version mismatch' }
          $dist = Join-Path $env:GITHUB_WORKSPACE dist
          New-Item -ItemType Directory $dist | Out-Null
          npx --yes --package @tauri-apps/cli@2.12.5 tauri build --bundles nsis -- --locked
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName (Join-Path $dist setup.exe)
          if ($env:CERT_THUMBPRINT) {
            foreach ($file in @('target/release/machine-party-mod-manager.exe', "$dist/setup.exe")) {
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:CERT_THUMBPRINT -or !$signature.TimeStamperCertificate) { throw "Invalid Authenticode signature on $file" }
            }
          }
          $overlay = @{version='0.0.1'; plugins=@{updater=@{endpoints=@("https://machineparty.ailaogong.men/v1/app-downloads/$version/manifest.json")}}}
          $overlay | ConvertTo-Json -Depth 6 | Set-Content acceptance.json
          Remove-Item target/release/bundle/nsis/*-setup.exe
          npx --yes --package @tauri-apps/cli@2.12.5 tauri build --config acceptance.json --bundles nsis -- --locked
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName (Join-Path $dist bootstrap.exe)
      - name: Verify clean install and upgrade from the Chinese directory
        if: runner.environment == 'github-hosted'
        shell: pwsh
        run: ./scripts/test-windows-install.ps1 -Installer (Resolve-Path dist/setup.exe)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: dist/
          retention-days: 14
  build-mac:
    if: github.ref == 'refs/heads/main' && inputs.build_run == ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Build Apple Silicon application
        working-directory: apps/desktop/src-tauri
        run: |
          set -eu
          rustup target add aarch64-apple-darwin
          npx --yes --package @tauri-apps/cli@2.12.5 tauri build --target aarch64-apple-darwin --bundles app -- --locked
          cd target/aarch64-apple-darwin/release/bundle/macos
          app=( *.app )
          codesign --verify --deep --strict "${app[0]}"
          archive="$RUNNER_TEMP/MachineParty-aarch64.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" "${app[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: ${{ runner.temp }}/MachineParty-aarch64.app.tar.gz
          retention-days: 14
  verify:
    if: inputs.verify_only && inputs.build_run != ''
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-installers
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
      - run: ./scripts/test-upgrade.ps1
  release:
    needs: [build, build-mac]
    if: always() && !inputs.verify_only && !cancelled() && github.ref == 'refs/heads/main' && ((needs.build.result == 'success' && needs.build-mac.result == 'success') || (needs.build.result == 'skipped' && inputs.build_run != ''))
    runs-on: windows-2022
    environment: production
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate installer source
        shell: bash
        env:
          BUILD_RUN: ${{ inputs.build_run || github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq 'select(.path == ".github/workflows/app-release.yml" and .head_branch == "main" and .event == "workflow_dispatch")|.head_sha')
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$sha" HEAD
          git diff --exit-code "$sha" HEAD -- . ':(exclude).github/**' ':(exclude)scripts/**' ':(exclude)tests/**' ':(exclude)docs/**' ':(exclude)*.md' ':(exclude).editorconfig' ':(exclude)package.json'
          echo "BUILD_SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-installers
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run || github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run || github.run_id }}
      - name: Validate stable Windows publisher
        shell: pwsh
        env:
          EXPECTED: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          $signature = Get-AuthenticodeSignature dist/setup.exe
          if (!$env:EXPECTED -or $signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:EXPECTED -or !$signature.TimeStamperCertificate) {
            throw 'Stable publication requires a timestamped, trusted Windows signature.'
          }
      - name: Sign platform updates
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          version=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')
          npx --yes --package @tauri-apps/cli@2.12.5 tauri signer sign --app-version "$version" -p '' dist/setup.exe
          npx --yes --package @tauri-apps/cli@2.12.5 tauri signer sign --app-version "$version" -p '' dist/MachineParty-aarch64.app.tar.gz
      - name: Stage version in R2
        run: python scripts/app-release.py stage
        env: &storage
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET_NAME }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      - name: Install old client and update through Worker
        run: ./scripts/test-upgrade.ps1
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -1 "$tag")" = "$BUILD_SHA"
          else
            git push origin "$BUILD_SHA:refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/setup.exe dist/setup.exe.sig dist/MachineParty-aarch64.app.tar.gz dist/MachineParty-aarch64.app.tar.gz.sig --verify-tag --title "$tag" --generate-notes
          else
            gh release download "$tag" -p setup.exe -D existing
            gh release download "$tag" -p MachineParty-aarch64.app.tar.gz -D existing
            cmp dist/setup.exe existing/setup.exe
            cmp dist/MachineParty-aarch64.app.tar.gz existing/MachineParty-aarch64.app.tar.gz
          fi
      - name: Promote stable manifest and verify public endpoint
        run: python scripts/app-release.py promote
        env: *storage
