name: R2 smoke test
on: workflow_dispatch

permissions: {}

jobs:
  round-trip:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: ${{ vars.R2_BUCKET_NAME }}
    steps:
      - name: Upload, read, verify and remove temporary object
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY}"
          [[ "$ACCOUNT_ID" =~ ^[a-f0-9]{32}$ && "$BUCKET" == "machine-party-mods" ]]
          key="smoke-tests/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          endpoint="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
          s3() { aws --no-cli-pager --endpoint-url "$endpoint" s3api "$@"; }
          object=(--bucket "$BUCKET" --key "$key")
          cd "$RUNNER_TEMP"
          printf 'R2 smoke test %s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > original.txt
          cleanup() { s3 delete-object "${object[@]}" >/dev/null; }
          trap cleanup EXIT
          s3 put-object "${object[@]}" --body original.txt >/dev/null
          s3 get-object "${object[@]}" downloaded.txt >/dev/null
          original=$(sha256sum original.txt | cut -d' ' -f1)
          downloaded=$(sha256sum downloaded.txt | cut -d' ' -f1)
          [[ "$original" == "$downloaded" ]]
          echo "Verified SHA-256: $original"
          cleanup
          trap - EXIT
          s3 list-objects-v2 --bucket "$BUCKET" --prefix "$key" --output json > listed.json
          jq -e --arg key "$key" 'all(.Contents[]?; .Key != $key)' listed.json >/dev/null
          s3 list-objects-v2 --bucket "$BUCKET" --prefix smoke-tests/ --output json | jq -c '[.Contents[]?.Key]'
          echo "Confirmed cleanup: $key"
