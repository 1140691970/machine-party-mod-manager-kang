name: Deploy mod catalog Worker
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Stage immutable catalog and first-party mod ZIPs in R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          r2() { aws --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com" s3api "$@"; }

          node scripts/pack-mod.mjs --all --verify-catalog --out "$RUNNER_TEMP/packages"
          for zip in "$RUNNER_TEMP/packages"/*.zip; do
            pkg_key="packages/sha256/$(basename "$zip")"
            if ! r2 head-object --bucket "$BUCKET" --key "$pkg_key" >/dev/null 2>&1; then
              r2 put-object --bucket "$BUCKET" --key "$pkg_key" --body "$zip" --content-type application/zip --if-none-match '*'
            fi
          done

          while read -r repo version filename sha size; do
            pkg_key="packages/sha256/$sha.zip"
            if ! r2 head-object --bucket "$BUCKET" --key "$pkg_key" >/dev/null 2>&1; then
              dl="$RUNNER_TEMP/$sha.zip"
              curl --fail --silent --show-error --retry 3 -L "https://github.com/$repo/releases/download/$version/$filename" -o "$dl"
              actual_size=$(wc -c < "$dl" | tr -d ' ')
              actual_sha=$(sha256sum "$dl" | awk '{print $1}')
              test "$actual_size" = "$size"
              test "$actual_sha" = "$sha"
              r2 put-object --bucket "$BUCKET" --key "$pkg_key" --body "$dl" --content-type application/zip --if-none-match '*'
            fi
          done < <(jq -r '.mods[] | select(.package.mirrorApproved == true) | "\(.repo) \(.version) \(.package.filename) \(.package.sha256) \(.package.size)"' catalog/mods.json)

          while read -r sha size; do
            actual=$(r2 head-object --bucket "$BUCKET" --key "packages/sha256/$sha.zip" --query ContentLength --output text)
            test "$actual" = "$size"
          done < <(jq -r '.mods[] | select(.package.mirrorApproved == true) | "\(.package.sha256) \(.package.size)"' catalog/mods.json)

          revision=$(jq -er '.revision | select(test("^[a-zA-Z0-9._-]+$"))' catalog/mods.json)
          key="catalog/revisions/$revision.json"
          if ! r2 get-object --bucket "$BUCKET" --key "$key" "$RUNNER_TEMP/catalog.json"; then
            r2 put-object --bucket "$BUCKET" --key "$key" --body catalog/mods.json --content-type application/json --if-none-match '*'
            r2 get-object --bucket "$BUCKET" --key "$key" "$RUNNER_TEMP/catalog.json"
          fi
          cmp catalog/mods.json "$RUNNER_TEMP/catalog.json"
      - name: Sign the full catalog for compatible mod updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          { printf 'machine-party-mod-catalog-v1\n'; cat catalog/mods.json; } > "$RUNNER_TEMP/mod-catalog"
          npx --yes --package @tauri-apps/cli@2.12.5 tauri signer sign -p '' "$RUNNER_TEMP/mod-catalog" > /dev/null
          test -s "$RUNNER_TEMP/mod-catalog.sig"
          echo "CATALOG_SIGNATURE_FILE=$RUNNER_TEMP/mod-catalog.sig" >> "$GITHUB_ENV"
      - run: node scripts/deploy-catalog.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify live Worker catalog and package downloads
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            curl --fail --silent --show-error --retry 3 -D "$RUNNER_TEMP/catalog.headers" "https://machineparty.ailaogong.men/v1/catalog.json?inventory=id&prepare=1" -o "$RUNNER_TEMP/live-catalog.json"
            signature=$(tr -d '\r' < "$RUNNER_TEMP/catalog.headers" | awk 'tolower($1) == "x-mod-catalog-signature:" {print $2}')
            if cmp -s catalog/mods.json "$RUNNER_TEMP/live-catalog.json" && test "$signature" = "$(cat "$CATALOG_SIGNATURE_FILE")"; then break; fi
            sleep 5
          done
          test "$signature" = "$(cat "$CATALOG_SIGNATURE_FILE")"
          cmp catalog/mods.json "$RUNNER_TEMP/live-catalog.json"
          while read -r id version asset size; do
            url="https://machineparty.ailaogong.men/v1/downloads/$id/$version/$asset"
            headers=$(curl --fail --silent --show-error --retry 3 -I "$url" | tr -d '\r')
            actual=$(awk 'tolower($1) == "content-length:" { print $2 }' <<< "$headers")
            test "$actual" = "$size"
            echo "Verified $url ($actual bytes)"
          done < <(jq -r '.mods[] | select(.package.mirrorApproved == true) | "\(.id) \(.version) \(.package.assetId) \(.package.size)"' catalog/mods.json)
