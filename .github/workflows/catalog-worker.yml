name: Deploy mod catalog Worker
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Stage immutable catalog snapshot and verify its contents
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -eu
          revision=$(jq -er '.revision | select(test("^[a-zA-Z0-9._-]+$"))' catalog/mods.json)
          key="catalog/revisions/$revision.json"
          r2() { aws --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com" s3api "$@"; }
          if ! r2 get-object --bucket "$BUCKET" --key "$key" "$RUNNER_TEMP/catalog.json"; then
            r2 put-object --bucket "$BUCKET" --key "$key" --body catalog/mods.json --if-none-match '*'
            r2 get-object --bucket "$BUCKET" --key "$key" "$RUNNER_TEMP/catalog.json"
          fi
          cmp catalog/mods.json "$RUNNER_TEMP/catalog.json"
      - run: node scripts/deploy-catalog.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
