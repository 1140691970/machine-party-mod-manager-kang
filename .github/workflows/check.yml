name: Source checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_ref="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base_ref" HEAD | grep -Eq '^(apps/desktop/|catalog/mods\.json|\.github/workflows/check\.yml)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:architecture
      - name: Install Godot 4.5.2 for headless mod tests
        working-directory: ${{ runner.temp }}
        run: |
          archive=Godot_v4.5.2-stable_linux.x86_64.zip
          curl -fsSLO --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/$archive"
          echo "e3ce6194b6d4d2dcef5e5b5136752c084d9d8b9071c10bc2d2011b947ec7439a257c8d23c541cb30699f16d9edea6dff36e6e84d2bec14a8fe9b4e9aacbe5a8d  $archive" | sha512sum -c -
          unzip -q "$archive"
          echo "GODOT_BIN=$PWD/${archive%.zip}" >> "$GITHUB_ENV"
      - run: npm test
  rust:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Check local broadcast process isolation
        working-directory: .
        shell: powershell
        run: ./tests/mods/broadcast-localtest.ps1
      - name: Verify optional Windows publisher signing
        working-directory: .
        run: ./scripts/test-windows-signature.ps1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The game-process fixture starts and stops a Machine Party.exe visible to other tests.
      - run: cargo test --locked -- --test-threads=1
